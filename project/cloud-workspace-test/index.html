<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Workspace Test</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b0d;color:#f2f5f3}
.card{width:min(680px,calc(100% - 32px));padding:28px;border:1px solid #26302c;border-radius:22px;background:#101512;box-shadow:0 20px 60px #0008}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#123d2d;color:#00ff9d;font-size:11px;letter-spacing:.08em}
h1{font-size:clamp(28px,6vw,48px);margin:14px 0 8px}
p{color:#aeb9b3;line-height:1.7}
button{border:0;border-radius:12px;padding:10px 15px;background:#00ff9d;color:#06110c;font-weight:700;cursor:pointer}
#status{margin-top:18px;padding:12px;border-radius:12px;background:#0b0f0d;color:#00ff9d;font:12px ui-monospace,monospace}
</style>
</head>
<body>
<main class="card">
<span class="badge">CLOUD WORKSPACE / VERIFIED TEST</span>
<h1>สร้างสำเร็จ ✓</h1>
<p>ไฟล์นี้ใช้ทดสอบเส้นทาง Create → Run → Preview → Verify ของ Bossnu โดยไม่พึ่ง localhost</p>
<button id="check">ตรวจสอบหน้าเว็บ</button>
<div id="status">พร้อมตรวจสอบ</div>
</main>
<script>
document.getElementById("check").onclick=()=>{
 const ok=document.querySelector("h1")?.textContent.includes("สร้างสำเร็จ");
 document.getElementById("status").textContent=ok?"HTML render check: PASS":"HTML render check: FAIL";
};
</script>
</body>
</html>
